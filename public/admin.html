<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Organizer desk · Thonglor Charity Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/css/site.css">
<script src="/js/common.js" defer></script>
<script src="/js/admin.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">THONGLOR <b>RUN</b></a>
    <nav class="main" aria-label="Organizer">
      <span class="kv" id="who"></span>
      <button class="btn small ghost" type="button" id="logout" hidden>Sign out</button>
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="th" aria-pressed="false">ไทย</button></div>
    </nav>
  </div>
</header>
<main>
  <section id="loginView" hidden>
    <div class="wrap">
      <form class="panel login" id="loginForm" novalidate>
        <div class="eyebrow">Organizer desk</div>
        <h2 style="margin:4px 0 16px">Sign in</h2>
        <div class="field"><label for="staffName">Your name</label><input type="text" id="staffName" autocomplete="name" placeholder="e.g. Desk A / Khun Nok"></div>
        <div class="field" style="margin-top:12px"><label for="password">Organizer password</label><input type="password" id="password" autocomplete="current-password" required></div>
        <div class="notice bad" id="loginErr" hidden style="margin-top:12px"></div>
        <button class="btn" type="submit" style="margin-top:16px;width:100%">Sign in</button>
      </form>
    </div>
  </section>

  <section class="block" id="deskView" hidden style="border-top:0">
    <div class="wrap">
      <div class="head"><div><div class="eyebrow">Organizer desk</div><h2>Registrations</h2></div>
        <a class="btn ink" href="/api/admin/export.csv" id="exportBtn">Export CSV</a></div>
      <form class="checkin" id="checkin" novalidate>
        <input type="text" id="checkinInput" placeholder="Scan e-ticket QR, or type a ref or bib number" aria-label="Find entry" autocomplete="off">
        <button class="btn" type="submit">Find entry</button>
      </form>
      <div class="tiles" id="tiles"></div>
      <div class="two">
        <div class="tablewrap"><table id="packTable"></table></div>
        <div class="tablewrap"><table id="shirtTable"></table></div>
      </div>
      <div class="toolbar">
        <input type="text" id="q" placeholder="Search name, ref, phone, email, bib, ID" aria-label="Search">
        <select id="fStatus" aria-label="Status filter"><option value="">All statuses</option><option value="awaiting_payment">Awaiting payment</option><option value="verifying">Check transfer</option><option value="paid">Confirmed</option><option value="cancelled">Cancelled</option><option value="expired">Expired</option></select>
        <select id="fPack" aria-label="Pack filter"><option value="">All packs</option><option>5K</option><option>10K</option><option>VIP</option></select>
      </div>
      <div class="tablewrap"><table id="regTable"></table></div>
      <div class="pager" id="pager"></div>
    </div>
  </section>
</main>
<div class="overlay" id="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div></div>
</body>
</html>
