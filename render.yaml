# Render Blueprint: New + > Blueprint > pick this repo. Fill the "sync: false" values in the dashboard.
services:
  - type: web
    name: thonglor-run
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: thonglor-run-db, property: connectionString }
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OMISE_PUBLIC_KEY
        sync: false
      - key: OMISE_SECRET_KEY
        sync: false
      - key: PROMPTPAY_ID
        sync: false
      - key: PROMPTPAY_NAME
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
databases:
  - name: thonglor-run-db
    region: singapore
    plan: basic-256mb
    databaseName: tgr
